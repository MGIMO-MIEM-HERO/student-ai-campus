services:
  campus:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      CAMPUS_SECURE_COOKIE: "1"
      CAMPUS_AI_URL: ${CAMPUS_AI_URL:-}
      CAMPUS_AI_MODEL: ${CAMPUS_AI_MODEL:-}
      CAMPUS_AI_KEY: ${CAMPUS_AI_KEY:-}
    volumes:
      - campus-data:/data
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CAMPUS_DOMAIN: ${CAMPUS_DOMAIN:?Set the public DNS name in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - campus

volumes:
  campus-data:
  caddy-data:
  caddy-config:
