# Статическая демо-версия на GitHub Pages: при каждом пуше в main и каждую ночь (даты расписания
# считаются от «сегодня», поэтому снимки кабинетов пересобираются ежедневно).
name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 21 * * *"   # 00:07 по Москве
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build static demo
        run: python tools/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
